<!doctype html>
<html lang="en" data-platform="windows-x64">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>qcatch</title>
    <style>
      :root {
        color-scheme: dark;
        font:
          16px/1.6 "Segoe UI Variable",
          "Segoe UI",
          system-ui,
          sans-serif;
        background: #16191c;
        color: #f1f4f6;
      }
      * {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      body {
        margin: 0 auto;
        max-width: 680px;
        padding: 40px 24px 64px;
      }
      header {
        align-items: center;
        display: flex;
        justify-content: space-between;
        margin-bottom: 64px;
      }
      .brand {
        align-items: center;
        display: flex;
        font-size: 21px;
        font-weight: 600;
        gap: 10px;
        letter-spacing: -0.025em;
      }
      .brand img {
        height: 32px;
        width: 32px;
      }
      h1 {
        font-size: clamp(30px, 6vw, 40px);
        font-weight: 600;
        letter-spacing: -0.04em;
        line-height: 1.15;
        margin: 0 0 24px;
      }
      p {
        margin: 0 0 20px;
      }
      code {
        color: #b6dffa;
        font: inherit;
        overflow-wrap: anywhere;
      }
      .command {
        display: block;
        margin-top: 8px;
      }
      .instructions {
        color: #c1cad0;
      }
      .field-label {
        display: block;
        margin-bottom: 8px;
      }
      .field {
        display: flex;
        gap: 8px;
        margin-bottom: 20px;
      }
      input {
        background: #20252a;
        border: 1px solid #4a555e;
        border-radius: 5px;
        color: #f1f4f6;
        font: inherit;
        min-width: 0;
        padding: 10px 12px;
        width: 100%;
      }
      button {
        background: #009df7;
        border: 0;
        border-radius: 5px;
        color: #101a22;
        cursor: pointer;
        flex: 0 0 auto;
        font: inherit;
        font-weight: 600;
        padding: 10px 16px;
      }
      button:hover {
        background: #28adfa;
      }
      select {
        background: transparent;
        border: 0;
        color: #9aa5ae;
        font: inherit;
        max-width: 110px;
        padding: 6px;
      }
      option {
        background: #20252a;
        color: #f1f4f6;
      }
      .result {
        color: #9aa5ae;
        min-height: 26px;
        margin: 0 0 16px;
      }
      .last {
        color: #9aa5ae;
      }
      @media (max-width: 420px) {
        body {
          padding-inline: 18px;
        }
        header {
          margin-bottom: 44px;
        }
        .field {
          align-items: flex-start;
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">
        <img src="extension/icons/icon-32.png" alt="" />qcatch
      </div>
      <select id="language" aria-label="Language">
        <option value="ru">Русский</option>
        <option value="en">English</option>
      </select>
    </header>
    <main>
      <h1 data-text="heading"></h1>
      <div class="instructions">
        <p data-install-only hidden>
          <span data-text="installLinux"></span>
          <code class="command">./qcatch --install</code>
        </p>
        <p data-install-only hidden>
          <span data-text="connectLinux"></span>
          <code class="command">~/.local/bin/qcatch --connect-browser chrome</code>
        </p>
        <p id="browser-options" hidden>
          <span data-text="open"></span> <code>edge://extensions</code>
          <span data-text="inEdge"></span> <code>chrome://extensions</code>
          <span data-text="inChrome"></span>.
        </p>
      </div>
      <section id="connect" hidden>
        <div id="address-field" hidden>
          <label class="field-label" for="address" data-text="addressLabel"></label>
          <div class="field">
            <input id="address" readonly />
            <button id="copy-address" type="button" data-text="copyAddress"></button>
          </div>
        </div>
        <p>
          <span data-text="enable"></span>
          <strong data-text="developer"></strong><span data-text="then"></span>
          <strong data-text="unpacked"></strong>.
        </p>
        <label class="field-label" for="path" data-text="folder"></label>
        <div class="field">
          <input id="path" readonly />
          <button id="copy-path" type="button" data-text="copyPath"></button>
        </div>
        <p class="result" id="result" role="status"></p>
      </section>
      <p class="last" data-text="pin"></p>
    </main>
    <script>
      const browser = new URLSearchParams(location.search).get("browser");
      const messages = {
        ru: {
          heading: "Подключить qcatch",
          installLinux: "Выполните команду в терминале из распакованной папки.",
          connectLinux: "Подключите Chrome или Chromium. Для Edge замените chrome на edge.",
          addressLabel: "Откройте адрес в новой вкладке",
          open: "Откройте",
          inEdge: "в Edge или",
          inChrome: "в Chrome",
          enable: "Включите",
          developer: "Режим разработчика",
          then: " и нажмите",
          unpacked: browser === "chrome" ? "Загрузить распакованное расширение" : "Загрузить распакованное",
          folder: "Выберите эту папку",
          copyAddress: "Копировать адрес",
          copyPath: "Копировать путь",
          copied: "Скопировано",
          failed: "Скопируйте выделенный текст вручную.",
          pin: "Закрепите qcatch на панели браузера.",
        },
        en: {
          heading: "Connect qcatch",
          installLinux: "Run this command in a terminal from the extracted folder.",
          connectLinux: "Connect Chrome or Chromium. For Edge, replace chrome with edge.",
          addressLabel: "Open this address in a new tab",
          open: "Open",
          inEdge: "in Edge or",
          inChrome: "in Chrome",
          enable: "Enable",
          developer: "Developer mode",
          then: " and click",
          unpacked: "Load unpacked",
          folder: "Select this folder",
          copyAddress: "Copy address",
          copyPath: "Copy path",
          copied: "Copied",
          failed: "Copy the selected text manually.",
          pin: "Pin qcatch to the browser toolbar.",
        },
      };
      const linux = document.documentElement.dataset.platform === "linux-x64";
      const address = browser === "edge" ? "edge://extensions"
        : browser === "chrome" ? "chrome://extensions" : "";
      for (const element of document.querySelectorAll("[data-install-only]"))
        element.hidden = !linux || Boolean(address);
      const connect = document.getElementById("connect");
      connect.hidden = linux && !address;
      document.getElementById("address-field").hidden = !address;
      document.getElementById("browser-options").hidden = linux || Boolean(address);
      document.getElementById("address").value = address;

      if (!connect.hidden) {
        const directory = new URL("extension", location.href);
        let path = decodeURIComponent(directory.pathname);
        if (!linux) {
          const networkShare = directory.protocol === "file:" && directory.hostname;
          path = (networkShare ? `//${directory.hostname}${path}` : path.replace(/^\//, ""))
            .replaceAll("/", "\\");
        }
        document.getElementById("path").value = path;
      }
      const result = document.getElementById("result");
      const languageSelect = document.getElementById("language");
      let language = navigator.languages[0]?.toLowerCase().startsWith("ru")
        ? "ru"
        : "en";
      try {
        const saved = localStorage.getItem("qcatch-language");
        if (saved === "ru" || saved === "en") language = saved;
      } catch {}
      function applyLanguage() {
        document.documentElement.lang = language;
        document.title = messages[language].heading;
        languageSelect.value = language;
        languageSelect.setAttribute(
          "aria-label",
          language === "ru" ? "Язык" : "Language",
        );
        for (const element of document.querySelectorAll("[data-text]"))
          element.textContent = messages[language][element.dataset.text];
        result.textContent = "";
      }
      languageSelect.onchange = () => {
        language = languageSelect.value;
        try {
          localStorage.setItem("qcatch-language", language);
        } catch {}
        applyLanguage();
      };
      for (const id of ["address", "path"]) {
        const field = document.getElementById(id);
        document.getElementById(`copy-${id}`).onclick = async () => {
          try {
            await navigator.clipboard.writeText(field.value);
            result.textContent = messages[language].copied;
          } catch {
            field.focus();
            field.select();
            result.textContent = messages[language].failed;
          }
        };
      }
      applyLanguage();
    </script>
  </body>
</html>
