[package]
name = "qcatch"
version = "1.0.0"
edition = "2024"
description = "Local media download and playback bridge for qcatch"
license = "AGPL-3.0-or-later"

[dependencies]
anyhow = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tiny_http = "0.12"
url = "2.5"
uuid = { version = "1.18", features = ["v4"] }
winreg = "=0.55.0"
zip = { version = "4.6", default-features = false, features = ["deflate"] }
windows = { version = "0.62.2", features = [
    "Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem",
    "Win32_System_Com", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_IO",
    "Win32_System_Ole", "Win32_System_Variant",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
